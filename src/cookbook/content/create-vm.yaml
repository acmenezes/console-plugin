- heading: Overview
  level: 2
  content:
    - type: text
      value: >
        This guide demonstrates how to create virtual machines using the OpenShift web console
        and pre-built templates. The web console provides an intuitive graphical interface for
        VM management, making it an ideal starting point for new users.

- heading: How Template-Based VM Creation Works
  level: 2
  content:
    - type: text
      value: >
        When you create a VM from a template, OpenShift Virtualization orchestrates several
        resources automatically.
    - type: steps
      items:
        - 'Template defines the VirtualMachine spec with a DataSource reference'
        - 'DataSource points to a pre-imported golden-image PVC'
        - 'DataVolume orchestrates the clone operation'
        - 'Clone produces a PVC in your project namespace'
        - 'virt-launcher pod starts and runs the VM via QEMU/KVM'
        - 'VirtualMachineInstance represents the running state'
    - type: note
      value: Clone operation duration depends on the disk size and the storage backend.
      variant: info

- heading: Prerequisites
  level: 2
  content:
    - type: text
      value: 'Before creating VMs, ensure the following requirements are met:'
    - type: steps
      items:
        - 'OpenShift 4.18+ with the OpenShift Virtualization operator installed'
        - 'Web console access with VM creation permissions'
        - 'Default StorageClass configured'
        - 'Available boot source images (DataSources)'
    - type: text
      value: 'Verify that boot source images are available:'
    - type: command
      value: oc get datasources -n openshift-virtualization-os-images
      action: list-datasources

- heading: 'Step 1: Access the Virtualization Section'
  level: 2
  content:
    - type: steps
      items:
        - 'Navigate to the OpenShift web console'
        - 'In the left navigation menu, click Virtualization'
        - 'Click the VirtualMachines tab to see existing VMs'

- heading: 'Step 2: Browse Available Templates'
  level: 2
  content:
    - type: text
      value: >
        Templates are organized by operating system category including Red Hat Enterprise Linux,
        Fedora, CentOS Stream, and Microsoft Windows. Templates showing "Source available"
        have pre-configured boot sources ready to use.
    - type: text
      value: 'Each template includes:'
    - type: steps
      items:
        - 'Pre-configured CPU and memory settings'
        - 'Appropriate disk size'
        - 'Boot source reference (DataSource)'
        - 'Cloud-init or sysprep configuration'

- heading: What a VM Template Contains
  level: 2
  content:
    - type: text
      value: >
        Templates carry parameters (fields with placeholders like ${NAME} replaced at creation),
        DataSource references in the openshift-virtualization-os-images namespace, and web console
        annotations for catalog display.
    - type: text
      value: 'Inspect the structure of a template:'
    - type: command
      value: oc get template fedora-server-small -n openshift -o yaml
      action: get-template

- heading: 'Step 3: Create a VM from a Template'
  level: 2
  content:
    - type: text
      value: >
        Select a template tile from the catalog, then configure your VM details. You can
        customize the name, project, boot source, CPU cores, and memory allocation on the
        Overview tab. Optionally adjust storage on the Disks tab.

- heading: Select and Configure
  level: 3
  content:
    - type: steps
      items:
        - 'Click the template tile that matches your desired OS'
        - 'Click Customize VirtualMachine to adjust settings'
        - 'Set the VM name and verify the project/namespace'
        - 'Adjust CPU cores and memory allocation as needed'
        - 'Review the Disks tab — optionally adjust size or add disks'
        - 'Click Create VirtualMachine to start provisioning'

- heading: Quick Create with Defaults
  level: 3
  content:
    - type: text
      value: >
        For a faster workflow, you can use Quick Create which accepts all template defaults
        and gets a running VM in seconds. Best for testing, demos, and throwaway development VMs.
    - type: text
      value: 'Or create a VM directly using the Console SDK:'
    - type: command
      value: '# Creates a Fedora VM with 2Gi memory and 30Gi disk in your active namespace'
      action: create-vm

- heading: 'Step 4: Monitor VM Creation'
  level: 2
  content:
    - type: text
      value: 'The VM goes through three provisioning phases:'
    - type: steps
      items:
        - 'Provisioning — disk cloning in progress'
        - 'Starting — VM is booting'
        - 'Running — VM is fully operational'
    - type: text
      value: 'Track provisioning progress from the CLI:'
    - type: command
      value: 'oc get events -n <your-namespace> --field-selector involvedObject.name=<vm-name> -w'

- heading: 'Step 5: Access the VM Console'
  level: 2
  content:
    - type: steps
      items:
        - 'Navigate to the VM details page'
        - 'Click the Console tab to open the VNC console'
    - type: text
      value: >
        The console toolbar provides options to send special key combinations, disconnect,
        and view guest credentials. If no cloud-init user data was provided, you may need
        to set up a user.

- heading: 'Step 6: Basic VM Operations'
  level: 2
  content:
    - type: text
      value: 'Common VM lifecycle operations are available from the Actions dropdown on the VM details page.'

- heading: Stop a VM
  level: 3
  content:
    - type: text
      value: 'Gracefully shut down a running VM:'
    - type: command
      value: virtctl stop <vm-name>

- heading: Restart a VM
  level: 3
  content:
    - type: text
      value: 'Perform a graceful restart:'
    - type: command
      value: virtctl restart <vm-name>

- heading: Pause and Unpause
  level: 3
  content:
    - type: text
      value: 'Pause a VM to temporarily suspend execution.'
    - type: note
      value: Paused VMs still consume memory resources on the node.
      variant: warning

- heading: Delete a VM
  level: 3
  content:
    - type: text
      value: 'Delete a VM from the Actions menu. You can choose to keep or delete associated disks.'
    - type: note
      value: Deleting a VM with its disks is permanent. Ensure you have backups if needed.
      variant: warning

- heading: 'Step 7: View VM Details and Metrics'
  level: 2
  content:
    - type: text
      value: >
        The VM details page provides several tabs including Overview (status, IPs, CPU/memory
        utilization, boot order), Metrics (real-time CPU, memory, network, and storage I/O),
        and YAML (view and edit the VM manifest directly).
    - type: note
      value: Full metrics require the QEMU guest agent to be installed inside the VM.
      variant: info

- heading: Choosing the Right VM Creation Method
  level: 2
  content:
    - type: text
      value: 'Choose the method that best fits your use case:'
    - type: steps
      items:
        - 'Quick Create from Template — Best for testing, demos, and throwaway development VMs'
        - 'Customized Template — Most common for day-to-day work with specific CPU, memory, or disk needs'
        - 'Custom YAML Manifests — Best for automation, GitOps pipelines, and full control over every field'
        - 'Custom Templates — Best for organizations with standardized VM configurations'
