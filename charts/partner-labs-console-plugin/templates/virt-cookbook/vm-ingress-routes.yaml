{{- if (index .Values.plugin.quickStarts "vm-ingress-routes").enabled }}
apiVersion: console.openshift.io/v1
kind: ConsoleQuickStart
metadata:
  name: vm-ingress-routes
  labels:
    {{- include "partner-labs-console-plugin.labels" . | nindent 4 }}
spec:
  displayName: "Expose a VM with an HTTPS Route"
  description: "Run Nginx in a Fedora VM, expose it through a Service and an HTTPS Route, and clean up the demo resources."
  durationMinutes: 15
  tags:
    - virtualization
    - networking
  prerequisites:
    - "OpenShift Virtualization installed with capacity for a VM with 1 vCPU and 2 GiB of memory"
    - "Permission to create projects, VirtualMachines, Services, and Routes, and to delete the demo resources"
    - "An authenticated oc CLI and Bash with curl; Run controls require the Web Terminal Operator"
    - "Cluster ingress with working wildcard DNS, and network policies that allow ingress traffic to the demo VM"
    - "Cluster access to quay.io/containerdisks/fedora:latest and guest access to Fedora package repositories"
  introduction: |-
    Run Nginx in a Fedora VM and expose its demo greeting through a Service and an HTTPS Route.

    No StorageClass is needed because the the VM's disk is temporary. Use Run when available or copy the commands into your authenticated Bash CLI.
  tasks:
    - title: "Create a dedicated test project"
      description: |-
        Create a new project for this tutorial:

        `oc new-project vm-ingress-demo`{{"{{execute}}"}}

        Continue only if this succeeds. If the project already exists, do not
        reuse or delete it. Choose an unused project name and substitute that
        name for `vm-ingress-demo` in every command in this tutorial.

        Commands below explicitly name the project, so they do not depend on
        the CLI's current project. Confirm the new project exists:

        `oc get project vm-ingress-demo`{{"{{execute}}"}}
      review:
        instructions: "Did you successfully create a new, dedicated project for this tutorial?"
        failedTaskHelp: "Choose an unused project name or ask your administrator for permission to create a project."
      summary:
        success: "A dedicated project is ready."
        failed: "Create a new project before continuing."

    - title: "Start a VM running Nginx"
      description: |-
        Create a Fedora VM with a masquerade interface on the pod network.
        Cloud-init installs Nginx and writes a demo page. No guest password is
        configured; console login is not required for this workflow.

        ```
        oc create -n vm-ingress-demo -f - <<'EOF'
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: web-vm
        spec:
          runStrategy: Always
          template:
            metadata:
              labels:
                app: vm-ingress-demo
            spec:
              domain:
                cpu:
                  cores: 1
                memory:
                  guest: 2Gi
                devices:
                  disks:
                    - name: rootdisk
                      disk:
                        bus: virtio
                    - name: cloudinitdisk
                      disk:
                        bus: virtio
                  interfaces:
                    - name: default
                      masquerade: {}
                      ports:
                        - port: 80
              networks:
                - name: default
                  pod: {}
              volumes:
                - name: rootdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
                - name: cloudinitdisk
                  cloudInitNoCloud:
                    userData: |-
                      #cloud-config
                      runcmd:
                        - dnf install -y nginx
                        - 'echo "Hello from OpenShift Virtualization" > /usr/share/nginx/html/index.html'
                        - systemctl enable --now nginx
        EOF
        ```{{"{{execute}}"}}

        Wait for the VM to become ready:

        `oc wait -n vm-ingress-demo vm/web-vm --for=condition=Ready --timeout=300s`{{"{{execute}}"}}

        Expect `condition met`.

        Although the VM is ready, cloud-init can take several more minutes to
        install packages and get Nginx up and running.
      review:
        instructions: "Did the VM readiness command report condition met?"
        failedTaskHelp: "Run oc describe vm web-vm -n vm-ingress-demo and inspect launcher pod events for capacity or image pull errors."
      summary:
        success: "The VM is ready; Nginx is being configured inside the guest."
        failed: "Resolve the VM startup issue before continuing."

    - title: "Create a Service for the VM"
      description: |-
        Create a ClusterIP Service. Its selector matches the label on the VM
        template, which is also present on the launcher pod:

        ```
        oc create -n vm-ingress-demo -f - <<'EOF'
        apiVersion: v1
        kind: Service
        metadata:
          name: web-vm-svc
        spec:
          selector:
            app: vm-ingress-demo
          ports:
            - name: http
              port: 80
              targetPort: 80
          type: ClusterIP
        EOF
        ```{{"{{execute}}"}}

        Inspect the Service and its EndpointSlices:

        `oc get service web-vm-svc -n vm-ingress-demo`{{"{{execute}}"}}

        `oc get endpointslice -n vm-ingress-demo -l kubernetes.io/service-name=web-vm-svc -o yaml`{{"{{execute}}"}}

        Look for a nonempty `addresses` list and `conditions.ready: true`.

        This confirms a ready backend for the Service.

        The HTTPS test in the next task verifies the guest web server is properly running.
      review:
        instructions: "Does the Service have an EndpointSlice with a ready backend address?"
        failedTaskHelp: "Check oc get pods -n vm-ingress-demo -l app=vm-ingress-demo and confirm the VM is ready and the Service selector matches."
      summary:
        success: "The Service selects the VM's launcher pod on port 80."
        failed: "Resolve the Service selector or VM readiness issue."

    - title: "Publish and test an HTTPS Route"
      description: |-
        Create a Route using the ingress controller's default certificate:

        ```
        oc create route edge web-vm-route -n vm-ingress-demo --service=web-vm-svc --port=http --insecure-policy=Redirect
        ```{{"{{execute}}"}}

        Edge termination encrypts client-to-router traffic. The router sends
        plain HTTP to the Service and the VM.

        HTTP clients are redirected to HTTPS and the VM guest does not need a TLS certificate.

        Inspect the Route, including its `Admitted` condition:

        `oc get route web-vm-route -n vm-ingress-demo -o yaml`{{"{{execute}}"}}

        Retrieve the Route URL:

        ```
        ROUTE_HOST=$(oc get route web-vm-route -n vm-ingress-demo -o jsonpath='{.spec.host}')
        echo "https://$ROUTE_HOST"
        ```{{"{{execute}}"}}

        In the same terminal session, test the URL. The retries allow time for
        Nginx installation and route admission. Expect **Hello from OpenShift Virtualization**:

        ```
        curl --fail --show-error --silent --retry 30 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 20 "https://$ROUTE_HOST"
        ```{{"{{execute}}"}}

        If your test cluster uses a private certificate authority, configure
        curl with its trusted CA using `--cacert`.

        For this demo greeting only, you can add `--insecure` to bypass certificate verification; that does
        not establish the server's identity. Do not use that option for sensitive data.

        A 503 can mean Nginx is still starting or the Service has no ready backend.

        Recheck the EndpointSlice and package repository access.

        For a timeout, check network policies and guest port 80. For DNS errors,
        ask your administrator to verify ingress wildcard DNS.

        You can also open the printed HTTPS URL in a browser.
      review:
        instructions: "Did the HTTPS request return Hello from OpenShift Virtualization?"
        failedTaskHelp: "Check route admission, certificate trust, DNS, the Service backend, and whether Nginx finished installing."
      summary:
        success: "The HTTPS Route reaches Nginx inside the VM."
        failed: "Resolve the HTTPS request error before marking the task complete."

    - title: "Clean up the demo resources"
      description: |-
        Remove only the resources created by this tutorial:

        ```
        oc delete route web-vm-route -n vm-ingress-demo
        oc delete service web-vm-svc -n vm-ingress-demo
        oc delete vm web-vm -n vm-ingress-demo --wait=true
        ```{{"{{execute}}"}}

        Verify that all three resources are gone. Expect no output and no errors:

        ```
        oc get route/web-vm-route service/web-vm-svc vm/web-vm -n vm-ingress-demo --ignore-not-found -o name
        ```{{"{{execute}}"}}

        If the project is still dedicated to this tutorial and contains nothing
        you want to keep, remove it too:

        `oc delete project vm-ingress-demo`{{"{{execute}}"}}
      review:
        instructions: "Did the resource verification command return no output and no errors?"
        failedTaskHelp: "Check deletion permissions and wait for the VM and its launcher pod to terminate."
      summary:
        success: "The demo Route, Service, and VM are removed."
        failed: "Finish deleting the demo resources."
  conclusion: |-
    You exposed a VM's HTTP application through an HTTPS Route and removed the
    demo resources. The request traveled from the client to the ingress router,
    through the Service's selected launcher pod, and into the VM's masquerade
    interface. TLS terminated at the router.

    Adapted from the [VM Ingress Routes tutorial](https://github.com/RedHatQuickCourses/ocp-virt-cookbook/blob/main/modules/networking/pages/vm-ingress-routes.adoc).
  nextQuickStart: []
{{- end }}
