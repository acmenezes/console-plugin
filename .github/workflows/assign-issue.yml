# Place at: .github/workflows/issue-assign.yml
# Commenters claim an open, unassigned issue with /assign and release it with /unassign.
name: issue self-assign

on:
  issue_comment:
    types: [created]

permissions:
  issues: write # assign, comment, react; nothing else

jobs:
  assign:
    # Issues only (not PRs), humans only, cheap prefix filter before spinning up a runner
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/assign') || startsWith(github.event.comment.body, '/unassign'))
    runs-on: ubuntu-latest
    # Serialize per issue so two simultaneous /assign comments can't both win
    concurrency:
      group: assign-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comment_id = context.payload.comment.id;
            const user = context.payload.comment.user.login;
            const me = user.toLowerCase();
            // Exact command only: "/assigned" or "/assign-me" are ignored
            const cmd = context.payload.comment.body.trim().split(/\s+/)[0].toLowerCase();
            if (cmd !== '/assign' && cmd !== '/unassign') return;
            const react = (content) =>
              github.rest.reactions.createForIssueComment({ owner, repo, comment_id, content });
            const reply = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number, body });
            // Re-fetch: the event payload can be stale if another claim just landed
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const current = issue.assignees.map((a) => a.login);
            const isMine = current.some((l) => l.toLowerCase() === me);
            if (cmd === '/unassign') {
              if (!isMine) return react('confused');
              await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: [user] });
              return react('+1');
            }
            if (issue.state !== 'open') {
              await react('confused');
              return reply(`@${user} this issue is closed and can't be claimed.`);
            }
            if (isMine) return react('+1'); // idempotent
            if (current.length) {
              await react('confused');
              // Backticks avoid pinging the existing assignee
              return reply(`@${user} this issue is already assigned to ${current.map((l) => `\`${l}\``).join(', ')}.`);
            }
            // addAssignees silently drops ineligible users (still returns 201), so verify
            const { data: updated } = await github.rest.issues.addAssignees({
              owner, repo, issue_number, assignees: [user],
            });
            if (updated.assignees.some((a) => a.login.toLowerCase() === me)) return react('+1');
            await react('confused');
            await reply(`@${user} GitHub rejected the assignment (account not eligible as an assignee on this repo).`);
